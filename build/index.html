<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Register & Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <section class="card">

            <div class="brand">
                <div class="brand-icon">✦</div>
                <h1>Welcome Portal</h1>
                <p>Your journey starts here.</p>
            </div>

            <div id="authSection">
                <div class="tabs">
                    <button id="loginTab" class="tab active" type="button">
                        Login
                    </button>

                    <button id="registerTab" class="tab" type="button">
                        Register
                    </button>
                </div>

                <form id="loginForm">
                    <h2>Welcome back!</h2>
                    <p class="subtitle">Sign in to continue.</p>

                    <label for="loginEmail">Email address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button class="primary-btn" type="submit">
                        Login
                    </button>
                </form>

                <form id="registerForm" class="hidden">
                    <h2>Create an account</h2>
                    <p class="subtitle">Join us in a few simple steps.</p>

                    <label for="registerName">Full name</label>
                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        minlength="2"
                        maxlength="60"
                        autocomplete="name"
                        required
                    >

                    <label for="registerEmail">Email address</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                    <label for="registerPassword">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="At least 8 characters"
                        minlength="8"
                        maxlength="72"
                        autocomplete="new-password"
                        required
                    >

                    <button class="primary-btn" type="submit">
                        Create Account
                    </button>
                </form>

                <div id="message" class="message hidden" role="status"
                     aria-live="polite"></div>
            </div>

            <section id="welcomeSection" class="hidden">
                <div class="success-icon">✓</div>

                <h2 id="welcomeTitle">You're logged in!</h2>

                <p id="welcomeMessage">
                    Welcome to your dashboard.
                </p>

                <button id="logoutBtn" class="primary-btn" type="button">
                    Logout
                </button>
            </section>

            <footer>
                Secure account access · Register · Login
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
